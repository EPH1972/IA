# ── Configuración StarCraft 1 RL (modo TorchCraft) ────────────────────────────

torchcraft:
  host: "192.168.0.23"  # Bridge adapter IP — bypasses VirtualBox NAT
  port: 11111          # puerto ZMQ por defecto de TorchCraft
  connect_timeout: 120 # segundos de espera hasta que BWAPI inicie el servidor

model:
  device: "cuda"         # "cuda" o "cpu"
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  epochs: 4
  batch_size: 64
  rollout_steps: 2048
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

training:
  total_timesteps: 1_000_000
  max_episode_steps: 2000
  save_interval: 1_000
  log_interval: 1_000
  checkpoint_dir: "checkpoints"

logging:
  dir: "logs"
  action_log_file: "action_log.jsonl"
